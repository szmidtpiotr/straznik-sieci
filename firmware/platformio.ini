; Strażnik sieci — firmware dla ESP32-S3-DevKitC (N16R8: 16 MB flash, 8 MB PSRAM)
; Build: pio run     Flash USB: pio run -t upload     Flash OTA: przez http://<ip>/update

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs

; Płytka wpięta w gniazdo „UART” (mostek CH343), więc Serial idzie po UART0,
; nie po natywnym USB.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=1
    -DARDUINOJSON_USE_LONG_LONG=1

lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    knolleary/PubSubClient@^2.8
